name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 3 días (los días 1, 4, 7, 10, etc.)
    - cron: '0 0 */3 * *'
  # Permite ejecutar el flujo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    keepalive:
       runs-on: ubuntu-latest
       permissions:
         contents: write        # necesario para el paso keepalive
         actions: write
    steps:
      - name: Hacer ping a la API de Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
      # Paso nuevo: evita que GitHub desactive el workflow
      - name: Keep workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2          
